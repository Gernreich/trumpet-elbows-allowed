<svg xmlns="http://www.w3.org/2000/svg" width="241.20mm" height="56.20mm" viewBox="0 0 241.20 56.20">
<title>trumpet-switchback bore - section 1 of 6, bend DL~a, 6 parts on 241x56mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch. Blocks 1-3 of the walk, entering on N and leaving on W, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
