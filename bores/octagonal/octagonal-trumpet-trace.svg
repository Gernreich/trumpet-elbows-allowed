<svg xmlns="http://www.w3.org/2000/svg" width="361.79mm" height="502.13mm" viewBox="0 0 361.79 502.13">
<title>The octagonal trumpet bore, traced - DISPLAY ONLY, not a cut file</title>
<desc>1 user unit = 1mm. The author traced the cheek of the bore band beside the sheet in octagonal-trumpet.svg; this is that trace with its two group transforms baked in, plus the centreline taken from it. The band is the outline as drawn, 30 points. The centreline is the midline between its two long edges, with stations closer than 12mm merged, 13 points and 1107.9mm long. The strip measures 30.7 to 35.5mm across against a nominal 31.2 - 25mm of airway with a 3mm wall each side - so treat the length as about +-1%. NOT A CUT FILE: nothing here is meant to reach a laser. The numbers live in bore-ribbon/traces/octagonal-trumpet.json and the bore is drawn at gernreich.github.io/bore-ribbon/</desc>
