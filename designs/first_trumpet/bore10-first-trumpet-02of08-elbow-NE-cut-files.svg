<svg xmlns="http://www.w3.org/2000/svg" width="121.80mm" height="43.20mm" viewBox="0 0 121.80 43.20">
<title>first-trumpet bore - section 2 of 8, elbow NE, 4 parts on 122x43mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 13-13 of the walk, entering on U and leaving on W, a 1x1 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
