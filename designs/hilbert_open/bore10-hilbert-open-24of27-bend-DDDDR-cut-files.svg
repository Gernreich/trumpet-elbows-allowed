<svg xmlns="http://www.w3.org/2000/svg" width="343.20mm" height="107.20mm" viewBox="0 0 343.20 107.20">
<title>hilbert-open bore - section 24 of 27, bend DDDDR, 6 parts on 343x107mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 165-170 of the walk, entering on N and leaving on U, a 2x5 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
