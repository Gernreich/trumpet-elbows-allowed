<svg xmlns="http://www.w3.org/2000/svg" width="97.090mm" height="28.500mm"
     viewBox="0 0 97.090 28.500">
  <title>Mouthpiece cup extension - 4 rings, ø10.06 to ø16.5mm rim</title>
  <desc>1 user unit = 1mm. 4 rings that stack on an existing mouthpiece ending at ø10.06mm and open it into a 12mm cup with a ø16.5mm rim. The bowl is an ellipse arc, so the wall stands parallel to the axis at the rim and turns toward the throat going down. Wall 3mm, 3mm of rise a ring. Every joint seats on at least 1.40mm per side, the joint onto the glued stack included. These are ADDITIONAL rings; they replace nothing.</desc>
