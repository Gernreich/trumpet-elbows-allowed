<svg xmlns="http://www.w3.org/2000/svg" width="121.000mm" height="138.040mm"
     viewBox="0 0 121.000 138.040">
  <title>Square-to-round mouthpiece - 26 rings, 25mm square bore to 3.66mm throat to ø10.06mm lip</title>
  <desc>1 user unit = 1mm. Station one is a sharp 25mm square aperture in a sharp 31mm square plate, matching the bore corner for corner. The corners round away going up and the section is a true circle from the 7.5mm station on, so the 3.66mm throat and the whole cup are round. 9 backbore rings in 2.5mm steps, then 17 cup rings in 0.40mm steps. Wall 3mm, 3mm of rise a ring, stack 78mm. Every joint seats on at least 1.00mm per side, flats and corners alike. Rings stack; they do not telescope.</desc>
