<svg xmlns="http://www.w3.org/2000/svg" width="187.168mm" height="191.931mm"
     viewBox="0 0 187.168 191.931">
  <title>Square-to-round trumpet bell - 17 rings of 3 ply, 153mm built on a 152mm profile, 10mm square throat to ø86.0mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 10mm square throat to ø86.0mm round rim over 153mm. The section morphs square to round on the linear schedule, holding area. Each ring is 3 lamination(s) of 3mm ply, 9mm of rise, seating on the ring below over 3.0mm per side. Rings stack; they do not telescope.</desc>
