<svg xmlns="http://www.w3.org/2000/svg" width="250.656mm" height="207.125mm"
     viewBox="0 0 250.656 207.125">
  <title>Square-to-round trumpet bell - 11 rings of 3 ply, 31mm square throat to ø93.3mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 31mm square throat to ø93.3mm round rim over 99mm. The section morphs square to round on the linear schedule, holding area. Each ring is 3 lamination(s) of 3mm ply, 9mm of rise, seating on the ring below over 1.5mm per side. Rings stack; they do not telescope.</desc>
