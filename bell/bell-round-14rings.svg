<svg xmlns="http://www.w3.org/2000/svg" width="328.953mm" height="353.209mm"
     viewBox="0 0 328.953 353.209">
  <title>Square-to-round trumpet bell - 14 rings of 5 ply, 31mm square throat to ø141.8mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 31mm square throat to ø141.8mm round rim over 210mm. The section morphs square to round on the linear schedule, holding area. Each ring is 5 lamination(s) of 3mm ply, 15mm of rise, seating on the ring below over 1.5mm per side. Rings stack; they do not telescope.</desc>
