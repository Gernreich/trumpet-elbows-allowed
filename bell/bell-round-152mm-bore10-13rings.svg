<svg xmlns="http://www.w3.org/2000/svg" width="197.719mm" height="153.689mm"
     viewBox="0 0 197.719 153.689">
  <title>Square-to-round trumpet bell - 13 rings of 4 ply, 10mm square throat to ø86.0mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 10mm square throat to ø86.0mm round rim over 156mm. The section morphs square to round on the linear schedule, holding area. Each ring is 4 lamination(s) of 3mm ply, 12mm of rise, seating on the ring below over 3.0mm per side. Rings stack; they do not telescope.</desc>
