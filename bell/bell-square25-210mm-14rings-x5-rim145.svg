<svg xmlns="http://www.w3.org/2000/svg" width="301.662mm" height="339.545mm"
     viewBox="0 0 301.662 339.545">
  <title>Square-to-round trumpet bell - 14 rings of 5 ply, 210mm built on a 201mm profile, 25mm square throat to ø144.8mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 25mm square throat to ø144.8mm round rim over 210mm. The section morphs square to round on the linear schedule, holding area. Each ring is 5 lamination(s) of 3mm ply, 15mm of rise, seating on the ring below over 3.0mm per side. Rings stack; they do not telescope.</desc>
