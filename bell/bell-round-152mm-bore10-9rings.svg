<svg xmlns="http://www.w3.org/2000/svg" width="163.400mm" height="178.061mm"
     viewBox="0 0 163.400 178.061">
  <title>Square-to-round trumpet bell - 9 rings of 6 ply, 10mm square throat to ø86.0mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 10mm square throat to ø86.0mm round rim over 162mm. The section morphs square to round on the linear schedule, holding area. Each ring is 6 lamination(s) of 3mm ply, 18mm of rise, seating on the ring below over 3.0mm per side. Rings stack; they do not telescope.</desc>
