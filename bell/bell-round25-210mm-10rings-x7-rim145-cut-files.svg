<svg xmlns="http://www.w3.org/2000/svg" width="261.639mm" height="275.757mm"
     viewBox="0 0 261.639 275.757">
  <title>Square-to-round trumpet bell - 10 rings of 7 ply, 210mm built on a 201mm profile, 25mm square throat to ø144.8mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 25mm square throat to ø144.8mm round rim over 210mm. The section morphs square to round on the linear schedule, holding area. Each ring is 7 lamination(s) of 3mm ply, 21mm of rise, seating on the ring below over 3.0mm per side. Rings stack; they do not telescope.</desc>
