<svg xmlns="http://www.w3.org/2000/svg" width="248.216mm" height="202.148mm"
     viewBox="0 0 248.216 202.148">
  <title>Square-to-round trumpet bell - 11 rings of 3 ply, 99mm built on a 99mm profile, 25mm square throat to ø96.3mm round rim</title>
  <desc>1 user unit = 1mm. Bessel horn, gamma 0.7, 25mm square throat to ø96.3mm round rim over 99mm. The section morphs square to round on the linear schedule, holding area. Each ring is 3 lamination(s) of 3mm ply, 9mm of rise, seating on the ring below over 3.0mm per side. Rings stack; they do not telescope.</desc>
