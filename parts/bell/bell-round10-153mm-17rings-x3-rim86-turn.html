  ['height',D.height+'mm'],['throat',D.throat+'mm'],['rim',D.rim+'mm'],
  ['section',D.shape]].map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
key(); revn(); addEventListener('resize',draw); draw();
</script>
