<svg xmlns="http://www.w3.org/2000/svg" width="337.20mm" height="70.20mm" viewBox="0 0 337.20 70.20">
<title>meander-fold2-long-straight-3t bore - section 9 of 12, bend LD, 6 parts on 337x70mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 30mm long and a block that turns is a 16mm cube. Blocks 31-33 of the walk, entering on W and leaving on N, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
