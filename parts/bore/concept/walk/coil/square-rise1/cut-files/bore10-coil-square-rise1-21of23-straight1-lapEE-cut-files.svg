<svg xmlns="http://www.w3.org/2000/svg" width="127.60mm" height="43.15mm" viewBox="0 0 127.60 43.15">
<title>coil-square-rise1 bore - section 21 of 23, straight 1@EE, 4 parts on 128x43mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 33-33 of the walk, entering on S and leaving on S, a 1x1 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
