<svg xmlns="http://www.w3.org/2000/svg" width="316.90mm" height="88.15mm" viewBox="0 0 316.90 88.15">
<title>coil-4x4-50 bore - section 45 of 45, bend LDDD~b, 6 parts on 317x88mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 180-184 of the walk, entering on D and leaving on N, a 2x4 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
