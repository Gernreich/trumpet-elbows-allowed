<svg xmlns="http://www.w3.org/2000/svg" width="330.90mm" height="73.15mm" viewBox="0 0 330.90 73.15">
<title>coil-10x10x30-2.25t bore - section 7 of 9, bend DR, 6 parts on 331x73mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 30mm long and a block that turns is a 16mm cube. Blocks 23-25 of the walk, entering on N and leaving on E, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
