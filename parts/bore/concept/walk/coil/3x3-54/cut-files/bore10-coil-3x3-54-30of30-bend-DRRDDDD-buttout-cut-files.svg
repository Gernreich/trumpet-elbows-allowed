<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="465.20mm" height="123.15mm" viewBox="0 0 465.20 123.15">
<title>coil-3x3-54 bore - section 30 of 30, bend DRRDDDD~b, 8 parts on 465x123mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 162-169 of the walk, entering on N and leaving on N, a 3x6 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
