<svg xmlns="http://www.w3.org/2000/svg" width="121.60mm" height="40.15mm" viewBox="0 0 121.60 40.15">
<title>coil-tight bore - section 1 of 33, straight 1~a@-W, 4 parts on 122x40mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 1-1 of the walk, entering on N and leaving on N, a 1x1 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
