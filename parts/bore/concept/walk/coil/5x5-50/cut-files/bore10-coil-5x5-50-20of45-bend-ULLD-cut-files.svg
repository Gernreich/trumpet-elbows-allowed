<svg xmlns="http://www.w3.org/2000/svg" width="369.20mm" height="59.15mm" viewBox="0 0 369.20 59.15">
<title>coil-5x5-50 bore - section 20 of 45, bend ULLD, 8 parts on 369x59mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 72-76 of the walk, entering on U and leaving on D, a 3x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
