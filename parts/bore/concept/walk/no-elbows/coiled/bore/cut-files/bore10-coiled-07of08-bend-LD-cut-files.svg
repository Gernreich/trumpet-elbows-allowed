<svg xmlns="http://www.w3.org/2000/svg" width="253.20mm" height="56.20mm" viewBox="0 0 253.20 56.20">
<title>coiled bore - section 7 of 8, bend LD, 6 parts on 253x56mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 43-45 of the walk, entering on W and leaving on D, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
