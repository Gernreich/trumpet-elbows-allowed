<svg xmlns="http://www.w3.org/2000/svg" width="342.80mm" height="72.13mm" viewBox="0 0 342.80 72.13">
<title>coil-fold2 bore - section 2 of 6, bend LUUR, 8 parts on 343x72mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 2.94mm sheet at 0.13mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 4-8 of the walk, entering on W and leaving on E, a 2x3 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
