<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="252.66mm" height="56.13mm" viewBox="0 0 252.66 56.13">
<title>coil-fold2 bore - section 3 of 6, bend RD, 6 parts on 253x56mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 2.94mm sheet at 0.13mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 9-11 of the walk, entering on E and leaving on N, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
