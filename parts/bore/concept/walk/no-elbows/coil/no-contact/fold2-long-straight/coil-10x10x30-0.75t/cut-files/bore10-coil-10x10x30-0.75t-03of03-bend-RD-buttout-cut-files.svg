<svg xmlns="http://www.w3.org/2000/svg" width="336.90mm" height="70.15mm" viewBox="0 0 336.90 70.15">
<title>coil-10x10x30-0.75t bore - section 3 of 3, bend RD~b, 6 parts on 337x70mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 30mm long and a block that turns is a 16mm cube. Blocks 9-11 of the walk, entering on E and leaving on N, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
