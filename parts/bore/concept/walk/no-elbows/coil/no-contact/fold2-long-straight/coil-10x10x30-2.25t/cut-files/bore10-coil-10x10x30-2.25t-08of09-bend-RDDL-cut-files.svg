<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="455.60mm" height="86.20mm" viewBox="0 0 455.60 86.20">
<title>coil-10x10x30-2.25t bore - section 8 of 9, bend RDDL, 8 parts on 456x86mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 30mm long and a block that turns is a 16mm cube. Blocks 26-30 of the walk, entering on E and leaving on W, a 2x3 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
