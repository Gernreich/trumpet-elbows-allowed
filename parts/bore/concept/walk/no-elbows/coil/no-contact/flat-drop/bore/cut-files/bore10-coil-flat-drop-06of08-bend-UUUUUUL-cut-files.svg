<svg xmlns="http://www.w3.org/2000/svg" width="407.20mm" height="139.20mm" viewBox="0 0 407.20 139.20">
<title>coil-flat-drop bore - section 6 of 8, bend UUUUUUL, 6 parts on 407x139mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 34-41 of the walk, entering on S and leaving on W, a 2x7 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
