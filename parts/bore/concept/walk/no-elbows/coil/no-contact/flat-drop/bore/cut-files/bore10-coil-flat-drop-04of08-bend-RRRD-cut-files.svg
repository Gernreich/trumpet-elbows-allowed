<svg xmlns="http://www.w3.org/2000/svg" width="380.90mm" height="56.15mm" viewBox="0 0 380.90 56.15">
<title>coil-flat-drop bore - section 4 of 8, bend RRRD, 6 parts on 381x56mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 26-30 of the walk, entering on E and leaving on D, a 4x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
