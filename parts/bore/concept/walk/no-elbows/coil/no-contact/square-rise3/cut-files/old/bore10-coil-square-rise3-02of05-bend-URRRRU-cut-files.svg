<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="497.60mm" height="75.20mm" viewBox="0 0 497.60 75.20">
<title>coil-square-rise3 bore - section 2 of 5, bend URRRRU, 8 parts on 498x75mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 7-13 of the walk, entering on U and leaving on U, a 5x3 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
