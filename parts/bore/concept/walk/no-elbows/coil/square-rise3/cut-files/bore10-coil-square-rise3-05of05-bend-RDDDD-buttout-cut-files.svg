<svg xmlns="http://www.w3.org/2000/svg" width="349.20mm" height="104.20mm" viewBox="0 0 349.20 104.20">
<title>coil-square-rise3 bore - section 5 of 5, bend RDDDD~b, 6 parts on 349x104mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 28-33 of the walk, entering on U and leaving on N, a 2x5 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
