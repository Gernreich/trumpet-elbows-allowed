<svg xmlns="http://www.w3.org/2000/svg" width="369.20mm" height="56.20mm" viewBox="0 0 369.20 56.20">
<title>wide-telescope bore - section 1 of 9, bend RRRD~a, 6 parts on 369x56mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 1-5 of the walk, entering on U and leaving on N, a 4x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
