<svg xmlns="http://www.w3.org/2000/svg" width="247.20mm" height="59.20mm" viewBox="0 0 247.20 59.20">
<title>spiral-telescope-wide bore - section 4 of 9, bend UL, 6 parts on 247x59mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 30-32 of the walk, entering on U and leaving on W, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
