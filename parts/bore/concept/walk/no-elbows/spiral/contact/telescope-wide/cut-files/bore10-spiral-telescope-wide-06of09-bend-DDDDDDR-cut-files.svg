<svg xmlns="http://www.w3.org/2000/svg" width="407.44mm" height="139.26mm" viewBox="0 0 407.44 139.26">
<title>spiral-telescope-wide bore - section 6 of 9, bend DDDDDDR, 6 parts on 407x139mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 2.94mm sheet at 0.13mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 53-60 of the walk, entering on N and leaving on U, a 2x7 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
