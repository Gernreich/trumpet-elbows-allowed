<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="529.60mm" height="107.20mm" viewBox="0 0 529.60 107.20">
<title>hilbert-open bore - section 5 of 27, bend UUUURRRD, 8 parts on 530x107mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 24-32 of the walk, entering on S and leaving on N, a 4x5 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
