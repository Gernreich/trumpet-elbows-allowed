<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="374.80mm" height="88.13mm" viewBox="0 0 374.80 88.13">
<title>hilbert-open bore - section 26 of 27, bend LDDDR, 8 parts on 375x88mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 2.94mm sheet at 0.13mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 177-182 of the walk, entering on D and leaving on U, a 2x4 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
