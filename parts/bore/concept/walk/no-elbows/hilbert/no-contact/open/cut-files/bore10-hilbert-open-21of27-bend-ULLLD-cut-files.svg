<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="433.60mm" height="59.20mm" viewBox="0 0 433.60 59.20">
<title>hilbert-open bore - section 21 of 27, bend ULLLD, 8 parts on 434x59mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 147-152 of the walk, entering on S and leaving on N, a 4x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
