<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="529.20mm" height="75.15mm" viewBox="0 0 529.20 75.15">
<title>spiral-ziggurat bore - section 6 of 13, bend DDLLLLU~f, 8 parts on 529x75mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 12-19 of the walk, entering on D and leaving on U, a 5x3 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
