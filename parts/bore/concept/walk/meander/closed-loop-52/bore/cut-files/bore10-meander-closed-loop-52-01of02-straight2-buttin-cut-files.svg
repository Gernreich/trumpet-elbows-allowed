<svg xmlns="http://www.w3.org/2000/svg" width="150.60mm" height="56.15mm" viewBox="0 0 150.60 56.15">
<title>meander-closed-loop-52 bore - section 1 of 2, straight 2~a, 4 parts on 151x56mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 16mm long and a block that turns is a 16mm cube. Blocks 1-2 of the walk, entering on N and leaving on N, a 1x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
