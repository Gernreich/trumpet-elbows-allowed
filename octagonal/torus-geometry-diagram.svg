<text x="268" y="246.5" font-size="4.8" fill="#475569">Only the inner tube's wall stands in the ring — the outer tube's grows outward, away from it.</text>
<text x="268" y="254.5" font-size="4.8" fill="#475569">So the outline-to-outline gap is 28, and the clear ring is 25.</text>
