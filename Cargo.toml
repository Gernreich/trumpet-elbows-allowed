[package]
name = "trumpet-elbows-allowed"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "Laser-cut trumpets: block bores on a lattice, and the bell and mouthpiece every bore shares"
license-file = "LICENSE"
publish = false
autobins = false

[lib]
name = "trumpet"
path = "tools/lib.rs"

# Rust since 2026-11-07, Python until then: the move changed no byte of any
# file these programs write. Each program sits beside the Python it replaced.

[[bin]]
name = "number_rings"
path = "parts/bell/number_rings.rs"

[[bin]]
name = "bell"
path = "parts/bell/bell.rs"

[[bin]]
name = "bell-round"
path = "parts/bell/bell-round.rs"

[[bin]]
name = "bell-adapter"
path = "parts/bell/bell-adapter.rs"

[[bin]]
name = "mouthpiece"
path = "parts/mouthpiece/mouthpiece.rs"

[[bin]]
name = "mouthpiece-round"
path = "parts/mouthpiece/mouthpiece-round.rs"

[[bin]]
name = "mouthpiece-cup"
path = "parts/mouthpiece/mouthpiece-cup.rs"

[[bin]]
name = "bell-section"
path = "parts/bell/bell-section.rs"

[[bin]]
name = "bell-view"
path = "parts/bell/bell-view.rs"

[[bin]]
name = "verify_bell"
path = "parts/bell/verify_bell.rs"

[[bin]]
name = "mouthpiece-view"
path = "parts/mouthpiece/mouthpiece-view.rs"

[[bin]]
name = "part-view"
path = "parts/part-view.rs"

[[bin]]
name = "bore_split"
path = "tools/bore_split_main.rs"

[[bin]]
name = "viewer"
path = "tools/viewer_main.rs"

[[bin]]
name = "bore_render"
path = "tools/bore_render_main.rs"

[[bin]]
name = "check"
path = "tools/check_main.rs"

[[bin]]
name = "hilbert"
path = "tools/hilbert.rs"

[[bin]]
name = "coils"
path = "tools/coils.rs"

[[bin]]
name = "sizes"
path = "tools/sizes.rs"

[[bin]]
name = "mcwalk"
path = "tools/mcwalk.rs"

[[bin]]
name = "bed_sheets"
path = "tools/bed_sheets.rs"

[[bin]]
name = "nest"
path = "tools/nest.rs"

[[bin]]
name = "piece_render"
path = "tools/piece_render.rs"

[[bin]]
name = "regress"
path = "tools/regress.rs"

[[bin]]
name = "repro"
path = "tools/repro.rs"

[[bin]]
name = "snakebox"
path = "tools/snakebox_main.rs"

[dependencies]
lasermade-tools = { path = "../lasermade-tools" }
geo = "0.33"

[profile.release]
opt-level = 3
