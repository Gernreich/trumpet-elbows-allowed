<svg xmlns="http://www.w3.org/2000/svg" width="330.90mm" height="73.15mm" viewBox="0 0 330.90 73.15">
<title>coil-fold2-long-straight-3t bore - section 4 of 12, bend DL, 6 parts on 331x73mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 30mm long and a block that turns is a 16mm cube. Blocks 12-14 of the walk, entering on N and leaving on D, a 2x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
