<svg xmlns="http://www.w3.org/2000/svg" width="481.20mm" height="73.15mm" viewBox="0 0 481.20 73.15">
<title>coil-fold2-long-straight-3t bore - section 5 of 12, bend DLLU, 8 parts on 481x73mm</title>
<desc>1 user unit = 1mm. 10mm square bore in 3mm stock, cut for a 3mm sheet at 0.15mm kerf, so a 16mm block pitch; a block that runs straight is 30mm long and a block that turns is a 16mm cube. Blocks 15-19 of the walk, entering on D and leaving on U, a 3x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
